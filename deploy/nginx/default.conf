# =============================================================================
# StudyTrack — nginx reverse proxy (production)
# Serves the FE static build at /, proxies /api -> FastAPI, and /ws -> FastAPI
# with WebSocket upgrade headers (wss). TLS via Let's Encrypt (certbot).
#
# REPLACE the domain placeholder below before first deploy:
#   studytrack.example.com  -> your real domain
# and ensure certs exist at /etc/letsencrypt/live/<domain>/ (bootstrap once
# with certbot --webroot; see docs/branch-protection.md is for CI, certs are
# bootstrapped manually the first time — then the certbot service auto-renews).
# =============================================================================

# Map for WebSocket Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Access log — redact query strings (audit M1) ---------------------------
# The WS auth token rides in the query string (/ws/notifications?token=<JWT>).
# nginx's stock "combined" format logs $request (the full request line, query
# included), which would persist JWTs in the access log. This format logs $uri
# (the normalized path, no args) instead, so tokens never hit disk. Set as the
# default for every server block in this file.
log_format studytrack_noquery
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log studytrack_noquery;

# Upstream FastAPI (internal compose network name "backend").
upstream studytrack_backend {
    server backend:8000;
}

# --- HTTP :80 — ACME challenge + redirect everything else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name studytrack.example.com;

    # Let's Encrypt http-01 challenge (served from the shared webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — the real app ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studytrack.example.com;

    # TLS (certbot-managed). Update paths if the domain changes.
    ssl_certificate     /etc/letsencrypt/live/studytrack.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studytrack.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reasonable upload ceiling (Base64 avatars in profiles).
    client_max_body_size 5m;

    # --- WebSocket: /ws -> backend (wss) ---
    location /ws {
        proxy_pass http://studytrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep long-lived sockets open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API: /api -> backend ---
    location /api {
        proxy_pass http://studytrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend SPA: everything else -> static build with history fallback ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
