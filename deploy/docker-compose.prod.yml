# =============================================================================
# StudyTrack — PRODUCTION docker-compose (runs on the VPS)
# Services:
#   nginx    -- TLS terminator + reverse proxy (80/443); serves FE static,
#               proxies /api and /ws to the backend (wss upgrade), and the
#               ACME http-01 challenge to certbot.
#   backend  -- FastAPI via gunicorn + uvicorn workers.
#   db       -- Postgres 16 with a named volume.
#   certbot  -- Let's Encrypt issuance/renewal (webroot).
#
# Secrets come from a server-side .env at the repo root (NOT in git).
# Build contexts (../backend, ../frontend) are produced by the other agents;
# this file wires them. Run via deploy/deploy.sh.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: studytrack-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Not published to the host — only reachable on the internal compose network.
    expose:
      - "5432"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: studytrack-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # CORS allow-list (comma-separated). MUST include the public FE origin(s),
      # e.g. the Vercel domain + the real app domain. The backend default is
      # localhost-only, so without this the deployed SPA is blocked by CORS.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Public base URL of the frontend — used to build verify/reset links in
      # emails. Must be the real https domain, not localhost.
      FRONTEND_URL: ${FRONTEND_URL}
      # Account email delivery (verify / password reset). Set EMAIL_BACKEND=smtp
      # in the server-side .env for real delivery; the default "console" only
      # logs the link (so verification silently won't reach users). See GO-LIVE.md.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-StudyTrack <no-reply@studytrack.app>}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_USE_TLS: ${EMAIL_SMTP_USE_TLS:-true}
      # Uncomment when the AI feature ships:
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    # gunicorn with uvicorn workers, bound on the internal network only.
    # single worker: in-memory WS manager + reminder scanner (Phase 5)
    # --forwarded-allow-ips "*": trust X-Forwarded-For from nginx (the backend
    # is expose-only on the internal network, so only nginx can reach it).
    # Without it every request appears to come from nginx's container IP and
    # slowapi's per-IP rate limits collapse into one site-wide bucket.
    command: >-
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 1
      --timeout 60
      --forwarded-allow-ips "*"
    expose:
      - "8000"

  # One-shot: build the SPA and publish it into the shared volume nginx serves.
  # The app is served same-origin as the API, so the build sets NO VITE_API_URL
  # (the FE then calls a relative /api and connects wss to its own host). Exits 0
  # when the copy is done; nginx waits for it via service_completed_successfully.
  frontend-build:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: build
    container_name: studytrack-prod-frontend-build
    command: ["sh", "-c", "rm -rf /export/* && cp -a /app/dist/. /export/"]
    volumes:
      - frontend_dist:/export
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: studytrack-prod-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Frontend static build output, produced by the frontend image/build step.
      - frontend_dist:/usr/share/nginx/html:ro
      # Let's Encrypt certs + ACME webroot, shared with certbot.
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: studytrack-prod-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renew twice a day; nginx picks up new certs on its next reload.
    entrypoint: >-
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

volumes:
  pgdata:
    name: studytrack_prod_pgdata
  # Populated by the one-shot `frontend-build` service above (copies its
  # `npm run build` output here); nginx serves it read-only at /.
  frontend_dist:
    name: studytrack_frontend_dist
